[project]
name = "maiz-yolo11"
version = "0.1.0"
description = "Detección, clasificación y conteo de granos de maíz sanos y con defectos con YOLOv11n y YOLOv11s"
requires-python = ">=3.14,<3.15"

dependencies = [
    # --- Deep learning (ruedas CUDA 13.2, ver [tool.uv.sources]) ---
    "torch>=2.14.1",
    "torchvision>=0.28.0",
    "ultralytics>=8.4.0",
    "numpy>=2.5.0",
    "pandas>=3.0.0",
    "scipy>=1.18.0",
    "scikit-learn>=1.9.0",
    "matplotlib>=3.11.0",
    "seaborn>=0.13.2",
    "opencv-python>=4.7.0,!=4.13.0.90",
    "pillow>=11.0.0",
    "pillow-heif>=0.18.0",          # lectura de fotos .HEIC (fondos sin granos)
    "albumentations>=2.0.0",
    "jupyterlab>=4.6.0",
    "ipykernel>=6.29.0",
    "tensorboard>=2.21.0",
    "tqdm>=4.67.0",
    "onnx>=1.17.0",
    "onnxruntime>=1.28.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu132" }
torchvision = { index = "pytorch-cu132" }
